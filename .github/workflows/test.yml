name: test

# CI minutes are paid for, so the default is not to spend them. A push to a
# feature branch raises no run at all, and a pull request raises one whose job
# skips unless something asks for it. Three things always run the suite anyway:
# a push to `main`, a pull request opened by Dependabot, and a release (which
# reaches this through `workflow_call` from release.yml).
#
# To run it on a feature branch regardless, either add the `run-ci` label to its
# pull request — which runs the suite then and on every push afterwards, since
# the label stays applied — or start one from Actions → test → Run workflow
# against the branch. The label has to exist in the repository before it can be
# applied; create it once under Issues → Labels.
#
# `branches: ["main"]` rather than a bare `push:` — a bare one also fires on tag
# pushes, which would run this suite twice for every release (once here, once as
# the release workflow's gate).
#
# `paths-ignore` skips the suite when a push or PR touches nothing but
# `docs/work/` — this repository tracks its own backlog there, and no test reads
# that board (every test builds its own fixture tree), so a run over a backlog
# edit can only repeat the previous commit's result. The filter applies to the
# event triggers only: `workflow_call` takes none, so a release still runs the
# full suite regardless of what the tagged commit changed.
#
# Do not make this workflow a *required* status check while that filter is here.
# A run skipped by `paths-ignore` reports nothing at all rather than success, so
# a required check would sit pending forever on exactly the backlog-only PRs this
# is meant to let through. The `if` gate below does not have that problem — a job
# skipped by a conditional still reports a conclusion.
on:
    push:
        branches: ["main"]
        paths-ignore: ["docs/work/**"]
    pull_request:
        # `labeled` is listed so that applying `run-ci` starts a run on a pull
        # request that is already open; naming any type means naming the three
        # defaults too.
        types: [opened, synchronize, reopened, labeled]
        paths-ignore: ["docs/work/**"]
    workflow_call:
    workflow_dispatch:

jobs:
    pytest:
        # Everything except an unlabelled pull request that Dependabot did not
        # open. Under `workflow_call` this reads the *caller's* event, which for
        # release.yml is a tag push, so a release passes the gate.
        if: >-
            github.event_name != 'pull_request'
            || github.event.pull_request.user.login == 'dependabot[bot]'
            || contains(github.event.pull_request.labels.*.name, 'run-ci')
        runs-on: ubuntu-latest
        strategy:
            # Both legs always report. A failure on 3.13 that hides whether 3.11
            # also broke costs a second push to find out.
            fail-fast: false
            matrix:
                # The `requires-python` floor, and the version the maintainer
                # actually develops on (3.14). 3.12 and 3.13 are omitted
                # deliberately: the suite is ~1200 tests at ~3 minutes a leg, and
                # floor + ceiling catches both back- and forward-compat
                # breakage. Keep the ceiling at or above the local interpreter —
                # a matrix that tops out below it tests a configuration nobody
                # runs.
                python-version: ["3.11", "3.14"]
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-python@v7
              with:
                  python-version: ${{ matrix.python-version }}
            # No Node in *this* job: pytest never shells out to it (`tcw serve`'s
            # runtime tests monkeypatch `shutil.which`). The Node-dependent
            # check has its own job below.
            - run: pip install -e '.[dev]'
            - run: pytest

    web-build:
        # `tcw serve` serves the committed build under `tcw/serve/dist`, not the
        # TypeScript source, so a fix to the client does not ship until the
        # bundle is rebuilt and committed. That went unnoticed for four commits
        # once: the tests, the types and the source were all correct and the
        # page still rendered blank for anyone running the web app.
        #
        # `pnpm check:build` rebuilds and fails if the committed output differs.
        # It existed the whole time and nothing ran it — not this workflow,
        # which installed no Node at all, and no test. Its own job rather than a
        # step in `pytest`, because it is independent of the Python version and
        # running it once per matrix leg would only repeat itself.
        if: >-
            github.event_name != 'pull_request'
            || github.event.pull_request.user.login == 'dependabot[bot]'
            || contains(github.event.pull_request.labels.*.name, 'run-ci')
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v7
              with:
                  # `engines.node` in package.json is >=22.12.0.
                  node-version: "22"
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm check:build
