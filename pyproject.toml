[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tcw-cli"
version = "2.5.0"
description = "Taxonomy · Capabilities · Work — a storage-abstracted framework for describing and evolving a software project."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = ["PyYAML>=6"]

[project.scripts]
tcw = "tcw.cli:main"

[project.optional-dependencies]
# jsonschema validates the work item projection against its declared schema.
# Tests only — nothing TCW ships imports it, and runtime dependencies stay at
# PyYAML alone. Writing the validator by hand would let the test and the
# projection share a bug.
#
# setuptools is the build backend, and `test_shipped_prompts` builds a wheel
# with `--no-build-isolation` to keep the suite off the network. It is not
# bundled with the interpreter from 3.12 on, so without this the wheel test
# fails on the 3.14 leg alone.
dev = ["pytest", "jsonschema", "setuptools>=61"]

[tool.setuptools.packages.find]
include = ["tcw*"]

[tool.setuptools.package-data]
"tcw.serve" = ["dist/*", "dist/**/*"]
"tcw.work" = ["prompts/*.md", "procedures/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The repository root on sys.path, so `from evals import ...` resolves. The
# eval-harness tests import it, and `evals` is deliberately not a published
# package (`packages.find` includes only `tcw*`), so the editable install does
# not put it there. `python -m pytest` happened to work anyway — that form puts
# the current directory on sys.path and bare `pytest` does not — which is why
# CI, which runs bare `pytest`, was the only place this failed.
pythonpath = ["."]
norecursedirs = [".venv", "build", "dist", "*.egg-info"]
