[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tcw-cli"
version = "1.2.3"
description = "Taxonomy · Capabilities · Work — a storage-abstracted framework for describing and evolving a software project."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = ["PyYAML>=6"]

[project.scripts]
tcw = "tcw.cli:main"

[project.optional-dependencies]
# jsonschema validates the work item projection against its declared schema.
# Tests only — nothing TCW ships imports it, and runtime dependencies stay at
# PyYAML alone. Writing the validator by hand would let the test and the
# projection share a bug.
#
# setuptools is the build backend, and `test_shipped_prompts` builds a wheel
# with `--no-build-isolation` to keep the suite off the network. It is not
# bundled with the interpreter from 3.12 on, so without this the wheel test
# fails on the 3.14 leg alone.
dev = ["pytest", "jsonschema", "setuptools>=61"]

[tool.setuptools.packages.find]
include = ["tcw*"]

[tool.setuptools.package-data]
"tcw.serve" = ["dist/*", "dist/**/*"]
"tcw.work" = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".venv", "build", "dist", "*.egg-info"]
